name: Deploy Static Site to VM

on:
  push:
    branches:
      - devops-branch  # or change to your working branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Copy files to VM
      uses: appleboy/scp-action@master
      with:
        host: 103.151.111.182
        username: root
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "."
        target: /root/static-site


    - name: SSH and deploy with Docker
      uses: appleboy/ssh-action@master
      with:
        host: 103.151.111.182
        username: root
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /root/static-site
          docker stop site || true && docker rm site || true
          docker build -t site .
          docker run -d -p 80:80 --name site site

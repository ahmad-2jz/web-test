name: Deploy Ecom App

on:
  push:
    branches:
      - devops-branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t ecommerce-app .

      - name: Run Docker container
        run: docker run -d -p 80:80 ecommerce-app

      - name: Health Check
        run: |
          sleep 5
          curl --fail http://localhost || (echo "App failed to start!" && exit 1)
